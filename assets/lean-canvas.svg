<svg xmlns="http://www.w3.org/2000/svg" width="2320" height="1370" viewBox="0 0 2320 1370">
<rect width="2320" height="1370" fill="#f5f5f2"/>
<rect x="20" y="20" width="456" height="1040" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="42" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202020" dominant-baseline="text-before-edge">2. ПРОБЛЕМА</text>
<rect x="40" y="98.39999999999998" width="416" height="125.6" fill="#fff09a"/>
<text x="58" y="114.39999999999998" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">По фотографиям сложно</text>
<text x="58" y="145.59999999999997" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">оценить состояние, посадку и</text>
<text x="58" y="176.79999999999995" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">работу вещи.</text>
<rect x="40" y="240.0" width="416" height="125.6" fill="#fff09a"/>
<text x="58" y="256.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Интересные находки трудно</text>
<text x="58" y="287.2" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">искать без точного названия</text>
<text x="58" y="318.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">товара.</text>
<rect x="40" y="381.6" width="416" height="125.6" fill="#fff09a"/>
<text x="58" y="397.6" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Демонстрация вещи в соцсетях</text>
<text x="58" y="428.80000000000007" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">и оформление сделки</text>
<text x="58" y="460.0000000000001" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">разрознены.</text>
<text x="42" y="533.2" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#202020" dominant-baseline="text-before-edge">СУЩЕСТВУЮЩИЕ АЛЬТЕРНАТИВЫ</text>
<text x="42" y="575.8000000000001" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Классифайды, Telegram- и</text>
<text x="42" y="605.7" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">VK-барахолки, публикации продавцов</text>
<text x="42" y="635.6" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">в соцсетях.</text>
<rect x="476" y="20" width="456" height="520" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="498" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202020" dominant-baseline="text-before-edge">4. РЕШЕНИЕ</text>
<rect x="496" y="98.39999999999998" width="416" height="94.4" fill="#fff09a"/>
<text x="514" y="114.39999999999998" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Видеообъявление: показ вещи,</text>
<text x="514" y="145.59999999999997" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">состояние, цена и город.</text>
<rect x="496" y="208.79999999999995" width="416" height="94.4" fill="#fff09a"/>
<text x="514" y="224.79999999999995" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Лента по интересам, бюджету и</text>
<text x="514" y="255.99999999999994" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">местоположению.</text>
<rect x="496" y="319.19999999999993" width="416" height="94.4" fill="#fff09a"/>
<text x="514" y="335.19999999999993" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Чат, резервирование и</text>
<text x="514" y="366.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">оформление заказа.</text>
<rect x="476" y="540" width="456" height="520" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="498" y="562" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202020" dominant-baseline="text-before-edge">8. КЛЮЧЕВЫЕ МЕТРИКИ</text>
<rect x="496" y="618.4" width="416" height="94.4" fill="#fff09a"/>
<text x="514" y="634.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Просмотр → обращение →</text>
<text x="514" y="665.6" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">завершённая покупка.</text>
<rect x="496" y="728.8" width="416" height="94.4" fill="#fff09a"/>
<text x="514" y="744.8" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Доля проданных вещей и время</text>
<text x="514" y="776.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">до продажи.</text>
<rect x="496" y="839.1999999999999" width="416" height="94.4" fill="#fff09a"/>
<text x="514" y="855.1999999999999" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Повторные сделки, удержание,</text>
<text x="514" y="886.3999999999999" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">CAC и маржинальный LTV.</text>
<rect x="932" y="20" width="456" height="1040" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="954" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202020" dominant-baseline="text-before-edge">3. УНИКАЛЬНАЯ ЦЕННОСТЬ</text>
<rect x="952" y="98.39999999999998" width="416" height="156.8" fill="#fff09a"/>
<text x="970" y="114.39999999999998" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Листай вещи в действии:</text>
<text x="970" y="145.59999999999997" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">короткое видео, состояние, цена</text>
<text x="970" y="176.79999999999995" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">и покупка — в одном</text>
<text x="970" y="207.99999999999994" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">объявлении.</text>
<rect x="952" y="271.2" width="416" height="125.6" fill="#fff09a"/>
<text x="970" y="287.2" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">В центре — конкретная вещь</text>
<text x="970" y="318.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">частного продавца, которую</text>
<text x="970" y="349.59999999999997" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">можно купить.</text>
<rect x="952" y="412.79999999999995" width="416" height="125.6" fill="#fff09a"/>
<text x="970" y="428.79999999999995" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Лента учитывает интересы, цену</text>
<text x="970" y="460.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">и город; проданные вещи</text>
<text x="970" y="491.20000000000005" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">исключаются.</text>
<text x="954" y="564.4" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#202020" dominant-baseline="text-before-edge">КОНКУРЕНТЫ</text>
<text x="954" y="607.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Авито — объявления. Wibes — видео</text>
<text x="954" y="636.9" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">о товарах Wildberries. Гипотеза:</text>
<text x="954" y="666.8" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">удобный видеосценарий продажи</text>
<text x="954" y="696.6999999999999" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">вещей с рук.</text>
<rect x="1388" y="20" width="456" height="520" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="1410" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202020" dominant-baseline="text-before-edge">9. СКРЫТОЕ</text>
<text x="1410" y="78.4" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202020" dominant-baseline="text-before-edge">ПРЕИМУЩЕСТВО</text>
<rect x="1408" y="134.8" width="416" height="94.4" fill="#fff09a"/>
<text x="1426" y="150.8" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">На старте подтверждённого</text>
<text x="1426" y="182.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">преимущества нет.</text>
<rect x="1408" y="245.20000000000005" width="416" height="156.8" fill="#fff09a"/>
<text x="1426" y="261.20000000000005" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Гипотеза: локальное</text>
<text x="1426" y="292.40000000000003" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">сообщество, репутация</text>
<text x="1426" y="323.6" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">участников и данные о</text>
<text x="1426" y="354.80000000000007" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">завершённых сделках.</text>
<rect x="1388" y="540" width="456" height="520" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="1410" y="562" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202020" dominant-baseline="text-before-edge">5. КАНАЛЫ</text>
<rect x="1408" y="618.4" width="416" height="94.4" fill="#fff09a"/>
<text x="1426" y="634.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Локальные Telegram- и</text>
<text x="1426" y="665.6" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">VK-сообщества.</text>
<rect x="1408" y="728.8" width="416" height="94.4" fill="#fff09a"/>
<text x="1426" y="744.8" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Блогеры о стиле, винтаже и</text>
<text x="1426" y="776.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">находках.</text>
<rect x="1408" y="839.1999999999999" width="416" height="125.6" fill="#fff09a"/>
<text x="1426" y="855.1999999999999" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Ссылки продавцов и</text>
<text x="1426" y="886.3999999999999" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">привлечение первых авторов</text>
<text x="1426" y="917.5999999999999" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">объявлений.</text>
<rect x="1844" y="20" width="456" height="1040" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="1866" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202020" dominant-baseline="text-before-edge">1. СЕГМЕНТЫ</text>
<text x="1866" y="78.4" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202020" dominant-baseline="text-before-edge">ПОТРЕБИТЕЛЕЙ</text>
<rect x="1864" y="134.8" width="416" height="156.8" fill="#fff09a"/>
<text x="1882" y="150.8" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Покупатели вещей с рук,</text>
<text x="1882" y="182.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">которым важно увидеть</text>
<text x="1882" y="213.2" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">состояние и использование</text>
<text x="1882" y="244.39999999999998" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">товара.</text>
<rect x="1864" y="307.6" width="416" height="125.6" fill="#fff09a"/>
<text x="1882" y="323.6" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Частные продавцы, готовые</text>
<text x="1882" y="354.80000000000007" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">показать свою вещь на коротком</text>
<text x="1882" y="386.0000000000001" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">видео.</text>
<text x="1866" y="459.20000000000005" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#202020" dominant-baseline="text-before-edge">РАННИЕ ПОСЛЕДОВАТЕЛИ</text>
<text x="1866" y="501.80000000000007" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Участники локальных сообществ</text>
<text x="1866" y="531.7" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">перепродажи одежды и аксессуаров,</text>
<text x="1866" y="561.6" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">уже использующие видео.</text>
<text x="1866" y="591.5" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202020" dominant-baseline="text-before-edge"></text>
<text x="1866" y="621.4" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Стартовая гипотеза: одна категория и</text>
<text x="1866" y="651.3" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">один город.</text>
<rect x="20" y="1060" width="1140" height="290" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="42" y="1082" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202020" dominant-baseline="text-before-edge">7. СТРУКТУРА ИЗДЕРЖЕК</text>
<rect x="40" y="1138.4" width="1100" height="63.2" fill="#fff09a"/>
<text x="58" y="1154.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Разработка, поддержка, модерация и привлечение пользователей.</text>
<rect x="40" y="1217.6000000000001" width="1100" height="63.2" fill="#fff09a"/>
<text x="58" y="1233.6000000000001" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Хранение, обработка и доставка видео; платёжные комиссии и сопровождение споров.</text>
<rect x="1160" y="1060" width="1140" height="290" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="1182" y="1082" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202020" dominant-baseline="text-before-edge">6. ПОТОКИ ПРИБЫЛИ</text>
<rect x="1180" y="1138.4" width="1100" height="63.2" fill="#fff09a"/>
<text x="1198" y="1154.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Комиссия с завершённых сделок внутри платформы.</text>
<rect x="1180" y="1217.6000000000001" width="1100" height="63.2" fill="#fff09a"/>
<text x="1198" y="1233.6000000000001" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202020" dominant-baseline="text-before-edge">Платное продвижение объявлений подходящей аудитории.</text>
</svg>